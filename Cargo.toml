[package]
name = "windevkit"
version = "0.1.0"
edition = "2024"
description = "Windows Development Environment Toolkit — one-command runtime install, version switching, and app export/import for fresh Windows setup"
license = "MIT"
repository = "https://github.com/sinvitry/windevkit"
authors = ["sinvitry"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# HTTP
reqwest = { version = "0.12", features = ["native-tls-vendored"] }

# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Environment",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Shell",
] }

# Archive
zip = "2"
flate2 = "1"
tar = "0.4"

# Progress bar
indicatif = "0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Interactive UI
inquire = "0.7"

# Terminal colors
colored = "2"

# Filesystem paths
dirs = "6"

# Serialization
serde_json = "1"

# Shell command execution
# (built-in std::process::Command, no extra crate needed)

[dev-dependencies]
rstest = "0.23"
wiremock = "0.6"
tempfile = "3"
predicates = "3"
assert_cmd = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
